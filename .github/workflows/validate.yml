name: Validate CAD reconstruction
on:
  push:
    branches: [main, 'aella/six-wheel-baseline-01', 'aella/actual-cad-mechanisms', 'aella/six-wheel-rover-integration']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check docs/app.js && node --check docs/scene.js && node --check docs/model.js && node --check docs/rover.js
      - run: node test-model.mjs
      - run: node test-cad.mjs
      - run: node test-connected-mechanics.mjs && node test-current-rover.mjs && node test-battery-polarity.mjs
      - run: node test-composed-body.mjs && node test-real-gltf-body.mjs
      - run: node test-electrical-scene.mjs && node test-rigid-matrix.mjs && node docs/assets/flange-regression/test-flange-fastener.mjs docs/assets/mechanical/adapter_R04.step docs/assets/flange-regression/flange-fastener-contract.json docs/assets/flange-regression/flange-fastener-report.json
      - run: node test-costs.mjs
      - run: node test-controls-ready.mjs
      - run: node docs/contact/scripts/validate.mjs
